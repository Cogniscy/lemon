name: Package and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,plots]"
      - run: python -m pytest -q -m "not artifacts"
      - run: python -m build
      - name: Test the wheel in an isolated environment
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile, venv
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as temp:
              env = pathlib.Path(temp) / "env"
              venv.EnvBuilder(with_pip=True).create(env)
              python = env / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              wheel = next((root / "dist").glob("*.whl"))
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
              subprocess.run([str(python), "-I", str(root / "scripts/smoke_installed.py")],
                             cwd=temp, check=True)
